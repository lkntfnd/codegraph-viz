# Publishes the package to npm (registry.npmjs.org) when a GitHub Release is published.
# Requires repo secret `npm_token` = an npmjs automation token with publish rights.
name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Verify vendored D3 parity
        run: npm run test:vendor
      - name: Inspect package contents
        run: npm pack --dry-run
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
