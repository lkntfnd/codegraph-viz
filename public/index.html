<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>codegraph-viz</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand" aria-label="codegraph-viz">
      <span class="brand-mark" aria-hidden="true">⌁</span>
      <span>code<span class="brand-accent">graph</span></span>
      <span class="brand-suffix">/viz</span>
    </div>

    <nav class="view-tabs" id="tabs" role="tablist" aria-label="Graph view">
      <button class="tab" type="button" role="tab" data-view="architecture" aria-selected="true">Architecture</button>
      <button class="tab" type="button" role="tab" data-view="filedeps" aria-selected="false">File deps</button>
      <button class="tab" type="button" role="tab" data-view="callgraph" aria-selected="false">Call graph</button>
    </nav>

    <div class="connection-meta" id="meta" role="status" aria-live="polite">
      <span class="live-dot is-loading" id="live-dot" aria-hidden="true"></span>
      <span id="meta-copy">Connecting to index…</span>
    </div>
  </header>

  <nav class="scope-rail" id="crumbs" aria-label="Current graph scope"></nav>

  <main class="workspace" id="workspace">
    <canvas id="graph" tabindex="0" aria-label="Interactive code relationship graph">
      Your browser needs Canvas support to display the code graph.
    </canvas>

    <div class="field-readout" aria-live="polite">
      <span class="field-view" id="field-view">Architecture</span>
      <span class="field-count" id="field-count">Loading graph…</span>
      <span class="field-warning" id="field-warning" hidden>View truncated</span>
    </div>

    <div class="placeholder" id="placeholder" role="status">
      <div class="placeholder-glyph" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 id="placeholder-title">Mapping project</h1>
      <p id="placeholder-body">Reading the local code index and preparing the field.</p>
    </div>

    <div class="graph-toolbar" aria-label="Graph controls">
      <button class="tool-button" id="fit-graph" type="button" title="Fit graph to view" aria-label="Fit graph to view">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M7 3H3v4M13 3h4v4M17 13v4h-4M7 17H3v-4" />
        </svg>
      </button>
    </div>

    <div id="settings-root"></div>
  </main>

  <script src="/vendor/d3.v7.min.js"></script>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
